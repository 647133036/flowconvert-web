[package]
name = "flowconvert"
version = "0.1.2"
edition = "2021"
description = "FlowConvert web server (Rust rewrite) - formats conversion, ID photo, translation, AI video/image generation"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
